name: CI (macOS)

# Portability check: native Bash 3.2 and the BSD userland on GitHub-hosted macOS runners, for
# every pull request, every push to main and on demand. It never gates releases; release.yml
# keys only on the CI workflow (ci.yml).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Main pushes and manual runs get unique groups; only heads of the same PR
  # compete for a group in this workflow.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native-shards:
    name: native shell tests (${{ matrix.shard }}/4)
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    outputs:
      shard-1: ${{ matrix.shard == 1 && steps.suite.outcome == 'success' && 'success' || '' }}
      shard-2: ${{ matrix.shard == 2 && steps.suite.outcome == 'success' && 'success' || '' }}
      shard-3: ${{ matrix.shard == 3 && steps.suite.outcome == 'success' && 'success' || '' }}
      shard-4: ${{ matrix.shard == 4 && steps.suite.outcome == 'success' && 'success' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check JSON parser dependency
        run: jq --version
      - name: Check native Bash and BSD helper behavior
        id: suite
        run: |
          scratch="$(mktemp -d "$RUNNER_TEMP/pk-macos-${{ matrix.shard }}.XXXXXX")"
          export HOME="$scratch/home" TMPDIR="$scratch/tmp"
          mkdir "$HOME" "$TMPDIR"
          /bin/bash tests/run.sh --native --shard "${{ matrix.shard }}/4"

  portable-helpers-macos:
    name: portable helpers (macOS)
    needs: [native-shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require all four native shards
        env:
          MATRIX_RESULT: ${{ needs.native-shards.result }}
          SHARD_1: ${{ needs.native-shards.outputs.shard-1 }}
          SHARD_2: ${{ needs.native-shards.outputs.shard-2 }}
          SHARD_3: ${{ needs.native-shards.outputs.shard-3 }}
          SHARD_4: ${{ needs.native-shards.outputs.shard-4 }}
        run: |
          for status in "$MATRIX_RESULT" "$SHARD_1" "$SHARD_2" "$SHARD_3" "$SHARD_4"; do
            if [ "$status" != success ]; then
              echo "Required native work did not succeed (matrix=$MATRIX_RESULT shards=$SHARD_1,$SHARD_2,$SHARD_3,$SHARD_4)" >&2
              exit 1
            fi
          done
