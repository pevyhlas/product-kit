name: CI

# The merge and release gate; release.yml keys on this workflow's name and path. It runs on a
# GitHub-hosted runner for every pull request, forks included, and for every push to main, with
# a read-only token and no secrets. ci-macos.yml is the macOS portability check; it does not
# gate releases.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check JSON parser dependency
        run: jq --version
      - name: Install ShellCheck 0.11.0
        # The pinned release, checked against GitHub's published sha256 for the asset, so CI lints
        # with the same ShellCheck as local validation, whatever version the runner image ships.
        run: |
          v=v0.11.0
          sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/$v/shellcheck-$v.linux.x86_64.tar.xz"
          echo "$sum  $dir/sc.tar.xz" | sha256sum -c -
          tar -xJf "$dir/sc.tar.xz" -C "$dir"
          echo "$dir/shellcheck-$v" >> "$GITHUB_PATH"
      - name: Run shell test suite
        run: bash tests/run.sh
      - name: Check manifest validation with legacy mawk
        # Debian 12's mawk lacks interval expressions; newer mawk releases support them.
        # Extract the pinned binary locally, without replacing the runner's default awk.
        run: |
          dir="$RUNNER_TEMP/legacy-mawk"
          mkdir -p "$dir/bin"
          curl -sSfL -o "$dir/mawk.deb" \
            https://deb.debian.org/debian/pool/main/m/mawk/mawk_1.3.4.20200120-3.1_amd64.deb
          echo "bcbc83f391854ea9d50ce2a4101aacf330de3b8b71d81a798faadba14a157f78  $dir/mawk.deb" | sha256sum -c -
          dpkg-deb -x "$dir/mawk.deb" "$dir/package"
          ln -s "$dir/package/usr/bin/mawk" "$dir/bin/awk"
          export PATH="$dir/bin:$PATH"
          awk -W version 2>&1 | grep -F 'mawk 1.3.4 20200120'
          if printf 'aaa\n' | awk '/^a{3}$/ { found = 1 } END { exit !found }'; then
            echo 'Expected an awk without interval-expression support' >&2
            exit 1
          fi
          bash tests/test_adoption_gate.sh
          bash tests/test_doctor.sh
      - name: Shellcheck scripts and tests
        # SC1091 (not following sourced files) is excluded repo-wide: scripts
        # source common.sh / lib.sh via runtime-resolved paths shellcheck
        # cannot follow. Everything else is fixed or has a scoped inline
        # disable with a reason comment next to it. The version check fails
        # the step if the pinned ShellCheck is not the one on PATH.
        run: |
          shellcheck --version | grep -qx 'version: 0.11.0'
          find scripts tests -name '*.sh' -print0 | xargs -0 shellcheck --exclude=SC1091
      - name: Check whitespace in tracked files
        # Diff against the empty tree so every tracked file is checked. A bare
        # `git diff --check` compares worktree to index and is empty on a clean
        # checkout, so it could never fail.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
