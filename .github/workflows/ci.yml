name: CI

# The merge and release gate; release.yml keys on this workflow's name and path. It runs on a
# GitHub-hosted runner for every pull request, forks included, and for every push to main, with
# a read-only token and no secrets. ci-macos.yml is the macOS portability check; it does not
# gate releases.

on:
  pull_request:
    # Re-evaluate the policy when the PR title changes, even at the same head.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  # Share a group only across heads of the same PR in this workflow. Every push
  # gets its own group so GitHub cannot replace even a pending release-gating run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-shards:
    name: shell tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Each matrix leg publishes only its own nonempty output. Shared names would
    # be last-writer-wins; require every expected leg as well as the matrix result.
    outputs:
      shard-1: ${{ matrix.shard == 1 && steps.suite.outcome == 'success' && 'success' || '' }}
      shard-2: ${{ matrix.shard == 2 && steps.suite.outcome == 'success' && 'success' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run shell test shard
        id: suite
        run: |
          scratch="$(mktemp -d "$RUNNER_TEMP/pk-linux-${{ matrix.shard }}.XXXXXX")"
          export HOME="$scratch/home" TMPDIR="$scratch/tmp"
          mkdir "$HOME" "$TMPDIR"
          bash tests/run.sh --shard "${{ matrix.shard }}/2"

  checks:
    name: lint and compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check JSON parser dependency
        run: jq --version
      - name: Install ShellCheck 0.11.0
        # The pinned release, checked against GitHub's published sha256 for the asset, so CI lints
        # with the same ShellCheck as local validation, whatever version the runner image ships.
        run: |
          v=v0.11.0
          sum=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          dir="$RUNNER_TEMP/shellcheck"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/$v/shellcheck-$v.linux.x86_64.tar.xz"
          echo "$sum  $dir/sc.tar.xz" | sha256sum -c -
          tar -xJf "$dir/sc.tar.xz" -C "$dir"
          echo "$dir/shellcheck-$v" >> "$GITHUB_PATH"
      - name: Check manifest validation with legacy mawk
        # Debian 12's mawk lacks interval expressions; newer mawk releases support them.
        # Extract the pinned binary locally, without replacing the runner's default awk.
        run: |
          dir="$RUNNER_TEMP/legacy-mawk"
          mkdir -p "$dir/bin"
          curl -sSfL -o "$dir/mawk.deb" \
            https://deb.debian.org/debian/pool/main/m/mawk/mawk_1.3.4.20200120-3.1_amd64.deb
          echo "bcbc83f391854ea9d50ce2a4101aacf330de3b8b71d81a798faadba14a157f78  $dir/mawk.deb" | sha256sum -c -
          dpkg-deb -x "$dir/mawk.deb" "$dir/package"
          ln -s "$dir/package/usr/bin/mawk" "$dir/bin/awk"
          export PATH="$dir/bin:$PATH"
          awk -W version 2>&1 | grep -F 'mawk 1.3.4 20200120'
          if printf 'aaa\n' | awk '/^a{3}$/ { found = 1 } END { exit !found }'; then
            echo 'Expected an awk without interval-expression support' >&2
            exit 1
          fi
          bash tests/test_adoption_gate.sh
          bash tests/test_doctor.sh
          bash tests/test_lifecycle.sh
          bash tests/test_spec_navigation.sh
      - name: Shellcheck scripts and tests
        # SC1091 (not following sourced files) is excluded repo-wide: scripts
        # source common.sh / lib.sh via runtime-resolved paths shellcheck
        # cannot follow. Everything else is fixed or has a scoped inline
        # disable with a reason comment next to it. The version check fails
        # the step if the pinned ShellCheck is not the one on PATH.
        run: |
          shellcheck --version | grep -qx 'version: 0.11.0'
          find scripts tests -name '*.sh' -print0 | xargs -0 shellcheck --exclude=SC1091
      - name: Check whitespace in tracked files
        # Diff against the empty tree so every tracked file is checked. A bare
        # `git diff --check` compares worktree to index and is empty on a clean
        # checkout, so it could never fail.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  test:
    name: test
    needs: [test-shards, checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require both shards and the checks lane
        env:
          MATRIX_RESULT: ${{ needs.test-shards.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          SHARD_1: ${{ needs.test-shards.outputs.shard-1 }}
          SHARD_2: ${{ needs.test-shards.outputs.shard-2 }}
        run: |
          for status in "$MATRIX_RESULT" "$CHECKS_RESULT" "$SHARD_1" "$SHARD_2"; do
            if [ "$status" != success ]; then
              echo "Required CI work did not succeed (matrix=$MATRIX_RESULT checks=$CHECKS_RESULT shards=$SHARD_1,$SHARD_2)" >&2
              exit 1
            fi
          done

  replay-plan:
    name: Select changed suites
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      ancestor: ${{ steps.plan.outputs.ancestor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ancestor=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --no-renames --name-only -z --diff-filter=AMT "$ancestor" "$HEAD_SHA" \
            -- ':(top,glob)tests/test_*.sh' > "$RUNNER_TEMP/suites.z"
          changed=false
          if [ -s "$RUNNER_TEMP/suites.z" ]; then changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "ancestor=$ancestor" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.changed == 'true'
        with:
          name: replay-plan
          path: ${{ runner.temp }}/suites.z
          retention-days: 1
          if-no-files-found: error

  base:
    name: Run changed suites on base
    needs: replay-plan
    if: github.event_name == 'pull_request' && needs.replay-plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replay-plan
          path: ${{ runner.temp }}
      - name: Run head tests against the merge base
        env:
          ANCESTOR: ${{ needs.replay-plan.outputs.ancestor }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cp scripts/maintainer/fails-on-base.sh "$RUNNER_TEMP/driver.sh"
          git checkout -q --detach "$ANCESTOR"
          git restore --source="$HEAD_SHA" --staged --worktree -- tests/
          bash "$RUNNER_TEMP/driver.sh" run "$RUNNER_TEMP/suites.z" "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-base
          path: ${{ runner.temp }}/result.json
          retention-days: 1
          if-no-files-found: error

  head:
    name: Run changed suites on head
    needs: replay-plan
    if: github.event_name == 'pull_request' && needs.replay-plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replay-plan
          path: ${{ runner.temp }}
      - name: Run the exact head
        run: bash scripts/maintainer/fails-on-base.sh run "$RUNNER_TEMP/suites.z" "$RUNNER_TEMP/result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-head
          path: ${{ runner.temp }}/result.json
          retention-days: 1
          if-no-files-found: error

  fails-on-base:
    name: Fails before the fix
    needs: [replay-plan, base, head]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the plan and both snapshot jobs
        env:
          PLAN: ${{ needs.replay-plan.result }}
          CHANGED: ${{ needs.replay-plan.outputs.changed }}
          BASE: ${{ needs.base.result }}
          HEAD: ${{ needs.head.result }}
        run: |
          case "$PLAN:$CHANGED:$BASE:$HEAD" in
            success:false:skipped:skipped) echo 'No changed suites.' >> "$GITHUB_STEP_SUMMARY" ;;
            success:true:success:success) ;;
            *) echo "INCONCLUSIVE: plan=$PLAN changed=$CHANGED base=$BASE head=$HEAD" | tee -a "$GITHUB_STEP_SUMMARY"; exit 2 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.replay-plan.outputs.changed == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.replay-plan.outputs.changed == 'true'
        id: results
        with:
          pattern: replay-*
          path: ${{ runner.temp }}/results
      - name: Compare complete results
        if: always() && needs.replay-plan.outputs.changed == 'true'
        env:
          DOWNLOAD: ${{ steps.results.outcome }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$DOWNLOAD" != success ]; then
            echo 'INCONCLUSIVE: result artifacts unavailable.' | tee -a "$GITHUB_STEP_SUMMARY"; exit 2
          fi
          root="$RUNNER_TEMP/results"
          bash scripts/maintainer/fails-on-base.sh compare "$root/replay-plan/suites.z" \
            "$root/replay-base/result.json" "$root/replay-head/result.json" "$PR_TITLE" >> "$GITHUB_STEP_SUMMARY" 2>&1
